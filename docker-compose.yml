# ==============================================================================
# Docker Compose - Orquestación de Contenedores para PagSurr
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pagsurr-fleet-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000/api}
      - VITE_SITE_URL=${VITE_SITE_URL:-http://localhost:3000}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    cpus: 1.0
