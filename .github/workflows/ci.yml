name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  audit-and-build:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalación Limpia de Dependencias (npm ci)
        run: npm ci

      - name: Verificación Estática y Linter (ESLint & TypeScript)
        run: npm run lint

      - name: Pruebas Automatizadas (Vitest)
        run: npm run test

      - name: Compilación de Producción (Vite + esbuild)
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SITE_URL: http://localhost:3000

      - name: Security Grep
        run: |
          if grep -rnEi "GEMINI_API_KEY|sk-[a-zA-Z0-9]{20,}" dist/ --exclude="*.cjs" --exclude="*.map"; then
            echo "CRITICAL SECURITY LEAK: Claves o secretos detectados en artefactos dist/"
            exit 1
          fi
