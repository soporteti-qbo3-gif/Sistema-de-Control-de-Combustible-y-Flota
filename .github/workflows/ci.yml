name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  audit-and-build:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalación Limpia de Dependencias (npm ci)
        run: npm ci

      - name: Verificación Estática y Linter (ESLint & TypeScript)
        run: npm run lint

      - name: Pruebas Automatizadas (Vitest)
        run: npm run test
        continue-on-error: true

      - name: Compilación de Producción (Vite + esbuild)
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SITE_URL: http://localhost:3000
